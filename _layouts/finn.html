<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.url == '/finn/' %}{{ page.title }}{% else %}{{ page.title }} | Finn{% endif %}</title>
<meta name="description" content="{{ page.description | default: 'Finn is a swim and snorkel buddy for Apple Watch and iPhone.' }}">
<link rel="canonical" href="https://yangjiyu98.github.io{{ page.url }}">
<meta name="apple-itunes-app" content="app-id=6824734537">
<meta name="theme-color" content="#0B1430">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Finn">
<meta property="og:title" content="{{ page.title }}">
<meta property="og:description" content="{{ page.description | default: 'Finn is a swim and snorkel buddy for Apple Watch and iPhone.' }}">
<meta property="og:url" content="https://yangjiyu98.github.io{{ page.url }}">
<meta property="og:image" content="https://yangjiyu98.github.io/finn/assets/iphone-1-today.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/finn/assets/finn.css">
{% if page.schema == 'app' %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "SoftwareApplication",
  "name": "Finn: Swim & Snorkel Buddy",
  "url": "https://yangjiyu98.github.io/finn/",
  "downloadUrl": "https://apps.apple.com/app/id6824734537",
  "operatingSystem": "iOS, watchOS",
  "applicationCategory": "HealthApplication",
  "description": "A pixel buddy swims with you on Apple Watch. Ten minutes in the water and someone new might turn up. Your logbook and aquarium live on your iPhone.",
  "image": "https://yangjiyu98.github.io/finn/assets/iphone-1-today.png",
  "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
}
</script>
{% endif %}
{% if page.faq %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [{% for q in page.faq %}
    { "@type": "Question", "name": {{ q.q | jsonify }},
      "acceptedAnswer": { "@type": "Answer", "text": {{ q.a | jsonify }} } }{% unless forloop.last %},{% endunless %}{% endfor %}
  ]
}
</script>
{% endif %}
</head>
<body>
<header class="top">
  <a class="brand" href="/finn/">finn.</a>
  <nav aria-label="Finn">
    <a href="/finn/faq">FAQ</a>
    <a href="/finn/support">Support</a>
  </nav>
</header>
<main>
{{ content }}
<p class="cta-row"><a class="store" href="https://apps.apple.com/app/id6824734537">Get Finn on the App Store</a></p>
</main>
<footer>
  <p><a href="https://apps.apple.com/app/id6824734537">Finn on the App Store</a> · <a href="/finn/">Home</a> · <a href="/finn/faq">FAQ</a> · <a href="/finn/support">Support</a> · <a href="/finn/privacy">Privacy</a></p>
  <p>Finn is for fun. It is not a dive computer.</p>
</footer>
</body>
</html>
